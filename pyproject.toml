[project]
name = "pdf-analysis"
version = "0.1.0"
description = ""
authors = [
    { name = "blee@filynai", email = "blee@filynai.com" }
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pdfplumber (>=0.11.7,<0.12.0)",
    "pdfminer.six (>=20221105,<20260000)",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "pydantic (>=2.12.0,<3.0.0)",
    "python-multipart (>=0.0.6,<0.0.10)",
    "fastapi (>=0.111.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "pdfminer (>=20191125,<20191126)",
    "fitz (>=0.0.1.dev2,<0.0.2)",
    "jpype1 (>=1.6.0,<2.0.0)"
]

[tool.poetry]
packages = [
    { include = "pdf_analysis", from = "src" },
    { include = "ind_pipeline", from = "src" },
]


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
mypy = "^1.18.2"
pandas-stubs = "^2.3.2.250926"
types-requests = "^2.32.4.20250913"
types-pyyaml = "^6.0.12.20250915"
httpx = "^0.27.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.optional-dependencies]
ocr = [
    "pytesseract (>=0.3.13,<0.4.0)",
    "pdf2image (>=1.17.0,<2.0.0)",
]
camelot = [
    "camelot-py (>=1.0.9,<2.0.0)",
]
tabula = [
    "tabula-py (>=2.10.0,<3.0.0)",
]
pdf_export = [
    "reportlab (>=4.2.2,<5.0.0)",
]
pymupdf = [
    "pymupdf (>=1.23.0,<2.0.0)",
]
cloud_ocr = [
    "google-cloud-vision (>=3.7.4,<4.0.0)",
    "boto3 (>=1.35.0,<2.0.0)",
]
llm = [
    "langchain-core (>=0.3.0,<0.4.0)",
    "langchain-openai (>=0.2.0,<0.4.0)",
    "langchain-text-splitters (>=0.3.0,<0.4.0)",
]

infra = [
    "boto3 (>=1.35.0,<2.0.0)",
    "redis (>=5.2.0,<6.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "openai (>=1.45.0,<2.0.0)",
    "httpx (>=0.27.2,<0.28.0)",
    "psycopg[binary] (>=3.2.12,<4.0.0)",
]





[tool.poetry.group.ocr]
optional = true

[tool.poetry.group.ocr.dependencies]
pytesseract = ">=0.3.13,<0.4.0"
pdf2image = ">=1.17.0,<2.0.0"





[tool.poetry.group.pymupdf]
optional = true

[tool.poetry.group.pymupdf.dependencies]
pymupdf = ">=1.23.0,<2.0.0"





[tool.poetry.group.llm]
optional = true

[tool.poetry.group.llm.dependencies]
langchain-core = ">=0.3.0,<0.4.0"
langchain-openai = ">=0.2.0,<0.4.0"
langchain-text-splitters = ">=0.3.0,<0.4.0"





[tool.poetry.group.infra]
optional = true

[tool.poetry.group.infra.dependencies]
boto3 = ">=1.35.0,<2.0.0"
redis = ">=5.2.0,<6.0.0"
python-dotenv = ">=1.0.1,<2.0.0"
psycopg = {extras = ["binary"], version = "^3.2.12"}





[tool.poetry.group.cloud_ocr]
optional = true

[tool.poetry.group.cloud_ocr.dependencies]
google-cloud-vision = ">=3.7.4,<4.0.0"
boto3 = ">=1.35.0,<2.0.0"

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_optional = true
# If you use many third-party libs without type hints:
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
