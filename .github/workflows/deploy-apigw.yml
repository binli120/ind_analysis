name: deploy-apigw

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-apigw:
    runs-on: ubuntu-latest
    environment: dev
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      APIGW_API_ID: ${{ secrets.APIGW_API_ID }}
      APIGW_STAGE: ${{ secrets.APIGW_STAGE }}
      APIGW_CORS_ORIGINS: ${{ secrets.APIGW_CORS_ORIGINS }}
      APIGW_CONNECTION_TYPE: ${{ secrets.APIGW_CONNECTION_TYPE }}
      APIGW_VPC_LINK_ID: ${{ secrets.APIGW_VPC_LINK_ID }}
      APIGW_INTEGRATION_URI: ${{ secrets.APIGW_INTEGRATION_URI }}
      APIGW_INTEGRATION_TIMEOUT_MS: ${{ secrets.APIGW_INTEGRATION_TIMEOUT_MS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2.1"

      - name: Install dependencies
        run: poetry install --only main

      - name: Generate OpenAPI JSON
        run: poetry run python scripts/generate_openapi.py --output openapi.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build API Gateway OpenAPI spec
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          spec_path = Path("openapi.json")
          if not spec_path.exists():
              raise SystemExit("openapi.json not found. Generate it before deploying.")

          spec = json.loads(spec_path.read_text())
          connection_type = os.environ.get("APIGW_CONNECTION_TYPE", "INTERNET").upper()
          vpc_link_id = os.environ.get("APIGW_VPC_LINK_ID", "")
          if connection_type == "VPC_LINK" and not vpc_link_id:
              raise SystemExit("APIGW_VPC_LINK_ID is required when using VPC_LINK.")

          integration_uri = os.environ.get("APIGW_INTEGRATION_URI", "")
          if not integration_uri:
              raise SystemExit("APIGW_INTEGRATION_URI is required.")
          if connection_type != "VPC_LINK" and integration_uri.startswith("arn:"):
              raise SystemExit("APIGW_INTEGRATION_URI must be a URL when using INTERNET.")

          timeout_ms = os.environ.get("APIGW_INTEGRATION_TIMEOUT_MS")
          timeout_value = int(timeout_ms) if timeout_ms else 29000

          spec["openapi"] = "3.0.1"

          for path, methods in spec.get("paths", {}).items():
              for method, operation in list(methods.items()):
                  if method.startswith("x-"):
                      continue
                  integration = {
                      "type": "http_proxy",
                      "httpMethod": "ANY",
                      "payloadFormatVersion": "1.0",
                      "requestParameters": {
                          "overwrite:path": "$request.path"
                      },
                      "uri": integration_uri,
                      "timeoutInMillis": timeout_value,
                  }
                  if connection_type == "VPC_LINK":
                      integration["connectionType"] = "VPC_LINK"
                      integration["connectionId"] = vpc_link_id
                  else:
                      integration["connectionType"] = "INTERNET"
                  operation["x-amazon-apigateway-integration"] = integration

          output_path = Path("build/apigw-openapi.json")
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(json.dumps(spec, indent=2))
          print(f"Wrote {output_path}")
          PY

      - name: Import or update HTTP API
        run: |
          set -euo pipefail
          SPEC="build/apigw-openapi.json"
          if [ -n "${APIGW_API_ID:-}" ]; then
            API_ID="$APIGW_API_ID"
            aws apigatewayv2 reimport-api \
              --api-id "$API_ID" \
              --body "file://${SPEC}"
          else
            API_ID=$(aws apigatewayv2 import-api \
              --body "file://${SPEC}" \
              --query 'ApiId' \
              --output text)
          fi
          echo "API_ID=${API_ID}" >> "$GITHUB_ENV"

      - name: Ensure API is public for dev testing
        run: |
          set -euo pipefail
          aws apigatewayv2 update-api \
            --api-id "$API_ID" \
            --no-disable-execute-api-endpoint

      - name: Attach VPC link integration to routes
        run: |
          set -euo pipefail
          CONNECTION_TYPE="${APIGW_CONNECTION_TYPE:-INTERNET}"
          if [ "${CONNECTION_TYPE}" != "VPC_LINK" ]; then
            echo "Skipping VPC link integration (connection type: ${CONNECTION_TYPE})."
            exit 0
          fi
          TIMEOUT_MS="${APIGW_INTEGRATION_TIMEOUT_MS:-29000}"
          INTEGRATION_ID=$(aws apigatewayv2 create-integration \
            --api-id "$API_ID" \
            --integration-type HTTP_PROXY \
            --integration-method ANY \
            --connection-type VPC_LINK \
            --connection-id "$APIGW_VPC_LINK_ID" \
            --integration-uri "$APIGW_INTEGRATION_URI" \
            --payload-format-version "1.0" \
            --timeout-in-millis "$TIMEOUT_MS" \
            --query 'IntegrationId' \
            --output text)
          echo "INTEGRATION_ID=${INTEGRATION_ID}" >> "$GITHUB_ENV"
          ROUTE_IDS=$(aws apigatewayv2 get-routes \
            --api-id "$API_ID" \
            --query 'Items[].RouteId' \
            --output text)
          if [ -z "${ROUTE_IDS}" ]; then
            echo "No routes found after import; cannot attach integration." >&2
            exit 1
          fi
          for route_id in ${ROUTE_IDS}; do
            aws apigatewayv2 update-route \
              --api-id "$API_ID" \
              --route-id "$route_id" \
              --target "integrations/${INTEGRATION_ID}" >/dev/null
          done

      - name: Configure CORS
        run: |
          set -euo pipefail
          CORS_CONFIG=$(python - <<'PY'
          import json
          import os

          raw_origins = os.environ.get(
              "APIGW_CORS_ORIGINS",
              "https://ind-manager-v2.vercel.app,http://localhost:3000,http://127.0.0.1:3000",
          )
          origins = [o.strip() for o in raw_origins.split(",") if o.strip()]
          payload = {
              "AllowOrigins": origins,
              "AllowMethods": ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
              "AllowHeaders": ["*"],
              "AllowCredentials": True,
              "MaxAge": 600,
          }
          print(json.dumps(payload))
          PY
          )
          aws apigatewayv2 update-api \
            --api-id "$API_ID" \
            --cors-configuration "$CORS_CONFIG"

      - name: Create or update stage
        run: |
          set -euo pipefail
          STAGE_NAME="${APIGW_STAGE:-dev}"
          if aws apigatewayv2 get-stage --api-id "$API_ID" --stage-name "$STAGE_NAME" >/dev/null 2>&1; then
            aws apigatewayv2 update-stage \
              --api-id "$API_ID" \
              --stage-name "$STAGE_NAME" \
              --auto-deploy
          else
            aws apigatewayv2 create-stage \
              --api-id "$API_ID" \
              --stage-name "$STAGE_NAME" \
              --auto-deploy
          fi

      - name: Show API endpoint
        run: |
          set -euo pipefail
          aws apigatewayv2 get-api \
            --api-id "$API_ID" \
            --query 'ApiEndpoint' \
            --output text
